<div class="mx-auto max-w-3xl space-y-4">
  <div>
    <h1 class="text-2xl font-semibold">Qui conduisait ?</h1>
    <p class="text-sm text-gray-500">Recherche ponctuelle par immatriculation et plage de dates.</p>
  </div>

  <form class="rounded-md border border-gray-200 bg-white p-5 shadow-sm" [formGroup]="form" (ngSubmit)="submit()">
    <label class="block text-sm font-medium">
      Immatriculation
      <input formControlName="immatriculation" class="mt-1 w-full rounded-md border border-gray-300 px-3 py-2" />
    </label>
    <div class="mt-4 grid gap-4 sm:grid-cols-2">
      <label class="block text-sm font-medium">
        Date de début
        <input type="datetime-local" formControlName="debut" class="mt-1 w-full rounded-md border border-gray-300 px-3 py-2" />
      </label>
      <label class="block text-sm font-medium">
        Date de fin
        <input type="datetime-local" formControlName="fin" class="mt-1 w-full rounded-md border border-gray-300 px-3 py-2" />
      </label>
    </div>
    <button type="submit" class="mt-4 rounded-md bg-accent px-4 py-2 text-sm font-semibold text-white" [disabled]="loading()">
      {{ loading() ? 'Recherche…' : 'Rechercher' }}
    </button>
  </form>

  @if (searched()) {
    @if (!resultats.length) {
      <p class="text-sm text-gray-500">Aucun résultat pour ces critères.</p>
    } @else {
      <div class="grid gap-3">
        @for (d of resultats; track d.id) {
          <app-demande-card [demande]="d" />
        }
      </div>
    }
  }
</div>
