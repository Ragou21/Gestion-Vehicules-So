<div class="flex min-h-screen items-center justify-center bg-page px-4 py-8">
  <div class="w-full max-w-lg rounded-md border border-gray-200 bg-white p-8 shadow-sm">
    <div class="mb-6 flex items-center gap-3">
      <app-logo />
      <div>
        <h1 class="text-lg font-semibold">Créer un compte</h1>
        <p class="text-sm text-gray-500">Chaque agent crée son profil</p>
      </div>
    </div>
    @if (error()) {
      <p class="mb-4 rounded-md bg-red-50 px-3 py-2 text-sm text-red-700">{{ error() }}</p>
    }
    <form class="grid gap-4 sm:grid-cols-2" [formGroup]="form" (ngSubmit)="submit()">
      <label class="block text-sm font-medium">
        Nom
        <input formControlName="nom" class="mt-1 w-full rounded-md border border-gray-300 px-3 py-2" />
      </label>
      <label class="block text-sm font-medium">
        Prénom
        <input formControlName="prenom" class="mt-1 w-full rounded-md border border-gray-300 px-3 py-2" />
      </label>
      <label class="block text-sm font-medium sm:col-span-2">
        Email
        <input type="email" formControlName="email" class="mt-1 w-full rounded-md border border-gray-300 px-3 py-2" />
      </label>
      <label class="block text-sm font-medium">
        Téléphone
        <input formControlName="telephone" class="mt-1 w-full rounded-md border border-gray-300 px-3 py-2" />
      </label>
      <label class="block text-sm font-medium">
        Rôle
        <select formControlName="role" class="mt-1 w-full rounded-md border border-gray-300 px-3 py-2">
          <option value="AGENT">Agent</option>
          <option value="RESPONSABLE">Responsable</option>
        </select>
      </label>
      <label class="block text-sm font-medium">
        Mot de passe
        <input type="password" formControlName="motDePasse" class="mt-1 w-full rounded-md border border-gray-300 px-3 py-2" />
      </label>
      <label class="block text-sm font-medium">
        Confirmation
        <input type="password" formControlName="confirmation" class="mt-1 w-full rounded-md border border-gray-300 px-3 py-2" />
      </label>
      <button
        type="submit"
        class="sm:col-span-2 rounded-md bg-accent px-4 py-2.5 text-sm font-semibold text-white hover:bg-blue-700 disabled:opacity-60"
        [disabled]="loading()"
      >
        {{ loading() ? 'Création…' : 'Créer le compte' }}
      </button>
    </form>
    <p class="mt-4 text-center text-sm text-gray-600">
      Déjà inscrit ?
      <a routerLink="/login" class="font-medium text-accent">Se connecter</a>
    </p>
  </div>
</div>
