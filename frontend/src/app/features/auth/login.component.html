<div class="flex min-h-screen items-center justify-center bg-page px-4">
  <div class="w-full max-w-md rounded-md border border-gray-200 bg-white p-8 shadow-sm">
    <div class="mb-6 flex items-center gap-3">
      <app-logo />
      <div>
        <h1 class="text-lg font-semibold">Connexion</h1>
        <p class="text-sm text-gray-500">Gestion des véhicules de service</p>
      </div>
    </div>
    @if (error()) {
      <p class="mb-4 rounded-md bg-red-50 px-3 py-2 text-sm text-red-700">{{ error() }}</p>
    }
    <form class="space-y-4" [formGroup]="form" (ngSubmit)="submit()">
      <label class="block text-sm font-medium">
        Email
        <input
          type="email"
          formControlName="email"
          class="mt-1 w-full rounded-md border border-gray-300 px-3 py-2 outline-none focus:border-accent"
        />
      </label>
      <label class="block text-sm font-medium">
        Mot de passe
        <input
          type="password"
          formControlName="motDePasse"
          class="mt-1 w-full rounded-md border border-gray-300 px-3 py-2 outline-none focus:border-accent"
        />
      </label>
      <button
        type="submit"
        class="w-full rounded-md bg-accent px-4 py-2.5 text-sm font-semibold text-white hover:bg-blue-700 disabled:opacity-60"
        [disabled]="loading()"
      >
        {{ loading() ? 'Connexion…' : 'Se connecter' }}
      </button>
    </form>
    <p class="mt-4 text-center text-sm text-gray-600">
      Pas encore de compte ?
      <a routerLink="/register" class="font-medium text-accent">Créer un compte</a>
    </p>
  </div>
</div>
